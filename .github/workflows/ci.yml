name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    name: ${{ matrix.os }} Node ${{ matrix.node }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    env:
      npm_config_script_shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        shell: bash
        run: npm test

      - name: Verify the CommonJS artifact
        shell: bash
        run: node scripts/build-cjs.mjs --check

      - name: CLI smoke test on a clean tree
        shell: bash
        run: node bin/secretsweep.mjs --version

      - name: CLI smoke test with a synthetic token
        shell: bash
        run: |
          set +e
          token="ghp_$(printf 'A%.0s' {1..36})"
          printf 'const token = "%s";\n' "$token" | node bin/secretsweep.mjs --stdin
          status=$?
          set -e
          test "$status" -eq 1

  fuzz:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked development dependencies
        run: npm ci
      - name: Run deterministic fast-check fuzz tests
        run: npm run test:fuzz
