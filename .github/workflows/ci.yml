name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    env:
      npm_config_script_shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        shell: bash
        run: npm test

      - name: Verify the CommonJS artifact
        shell: bash
        run: node scripts/build-cjs.mjs --check

      - name: CLI smoke test on a clean tree
        shell: bash
        run: node bin/secretsweep.mjs --version

      - name: CLI smoke test with a synthetic token
        shell: bash
        run: |
          set +e
          token="ghp_$(printf 'A%.0s' {1..36})"
          printf 'const token = "%s";\n' "$token" | node bin/secretsweep.mjs --stdin
          status=$?
          set -e
          test "$status" -eq 1
